<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الموافقات - شركة تكافل العراق للتامين التكافلي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar" id="topbar"></header>
      <section class="content-wrap">
        <article class="card">
          <div class="card-header"><h3>الطلبات قيد المراجعة</h3></div>
          <div id="approvalsList" class="approval-list"></div>
        </article>
      </section>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="confirmModal">
    <div class="modal-card">
      <h3 id="modalTitle">تأكيد الإجراء</h3>
      <p id="modalMessage"></p>
      <div>
        <label for="decisionNote">ملاحظة القرار (اختياري)</label>
        <textarea id="decisionNote" rows="3" placeholder="اكتب ملاحظة أو اتركها فارغة..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="modalSkip">تخطي</button>
        <button class="btn btn-ghost" id="modalCancel">إلغاء</button>
        <button class="btn btn-primary" id="modalConfirm">تأكيد</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="detailsModal">
    <div class="modal-card details-modal-card">
      <h3 id="detailsTitle">تفاصيل الطلب</h3>
      <div id="detailsBody" class="details-body"></div>
      <div class="modal-actions"><button class="btn btn-primary" id="detailsClose">إغلاق</button></div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/firebase.js?v=20260810-sync-1"></script>
  <script src="js/app.js?v=20260810-2"></script>
  <script src="js/auth.js?v=20260810-3"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="js/requests.js?v=20260810-transfer-2"></script>
</body>
</html>
