<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نظام الطلبات الداخلية - تسجيل الدخول</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-body">
  <div class="login-shell">
    <section class="login-panel glass">
      <div class="brand-row">
        <div class="brand-icon">IR</div>
        <div>
          <h1>نظام الطلبات الداخلية</h1>
          <p>بوابة سير العمل المؤسسية</p>
        </div>
      </div>
      <form id="loginForm" class="form-grid" novalidate>
        <div>
          <label for="username">اسم المستخدم</label>
          <input id="username" name="username" type="text" autocomplete="username" required />
        </div>
        <div>
          <label for="password">كلمة المرور</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <p id="loginError" class="error-text"></p>
        <button id="loginBtn" type="submit" class="btn btn-primary">دخول</button>
      </form>
      <div class="demo-users">
        <p><strong>حسابات التجربة</strong></p>
      </div>
    </section>
  </div>
  <div id="toastContainer" class="toast-container"></div>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
