<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دخول iPhone - شركة تكافل العراق</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" />
  <link rel="stylesheet" href="css/style.css?v=iphone-login-1" />
</head>
<body class="login-body">
  <div class="login-shell">
    <section class="login-panel glass">
      <div class="login-layout">
        <aside class="login-aside">
          <div class="login-head">
            <div class="brand-row">
              <div class="brand-icon">
                <img src="Logo Iraq Takaful Option.jpg(1).jpeg" alt="Logo Iraq Takaful" class="brand-logo" />
              </div>
              <div>
                <h1>شركة تكافل العراق للتامين التكافلي</h1>
                <p>دخول خاص للهاتف - Safari iPhone</p>
              </div>
            </div>
            <div class="status-badge">تم تجهيز هذه الصفحة لتجاوز كاش وبيانات الهاتف القديمة</div>
          </div>
        </aside>
        <div class="login-main">
          <form id="iphoneLoginForm" class="form-grid" novalidate>
            <div>
              <label for="username">اسم المستخدم</label>
              <input id="username" name="username" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="ceo" required />
            </div>
            <div>
              <label for="password">كلمة المرور</label>
              <input id="password" name="password" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="CEO2026Approve" required />
            </div>
            <p id="loginError" class="error-text"></p>
            <button id="loginBtn" type="submit" class="btn btn-primary btn-login">دخول من الهاتف</button>
          </form>
        </div>
      </div>
    </section>
  </div>
  <div id="toastContainer" class="toast-container"></div>
  <script>
    (function () {
      var users = [
        { username: "it_", password: "IT2026Secure", role: "IT", permissions: ["all"] },
        { username: "ceo", password: "CEO2026Approve", role: "CEO", permissions: ["view_all", "approve"] },
        { username: "fns", password: "FNS2026Finance", role: "FNS", permissions: ["create", "view_all", "export_pdf"] },
        { username: "sns", password: "SNS2026Access", role: "SNS", permissions: ["create", "view_all", "export_pdf"] }
      ];

      function clean(value) {
        return String(value || "")
          .replace(/[\u200B-\u200D\uFEFF]/g, "")
          .replace(/\s+/g, "")
          .trim();
      }

      function setJson(key, value) {
        localStorage.setItem(key, JSON.stringify(value));
      }

      localStorage.removeItem("irs_current_user");
      setJson("irs_users", users);

      document.getElementById("iphoneLoginForm").addEventListener("submit", function (event) {
        event.preventDefault();
        var username = clean(document.getElementById("username").value).toLowerCase();
        var password = clean(document.getElementById("password").value);
        var error = document.getElementById("loginError");
        var user = users.find(function (item) {
          return item.username.toLowerCase() === username && item.password === password;
        });

        if (!user) {
          error.textContent = "بيانات الدخول غير صحيحة. اكتب كلمة المرور يدويا باللغة الانكليزية.";
          return;
        }

        setJson("irs_current_user", {
          username: user.username,
          role: user.role,
          permissions: user.permissions
        });
        window.location.href = "dashboard.html?v=iphone-login-1";
      });
    })();
  </script>
</body>
</html>
