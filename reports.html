<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>التقارير - شركة تكافل العراق للتامين التكافلي</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar" id="topbar"></header>
      <section class="content-wrap">
        <article class="card">
          <div class="toolbar">
            <input id="fromDate" type="date" />
            <input id="toDate" type="date" />
            <select id="statusSel">
              <option value="all">كل الحالات</option>
              <option value="Pending">قيد الانتظار</option>
              <option value="Approved">موافق عليه</option>
              <option value="Rejected">مرفوض</option>
            </select>
            <input id="deptSearch" type="text" placeholder="فلتر حسب القسم..." />
          </div>
        </article>

        <div class="report-kpi-grid" id="reportKpis"></div>

        <div class="grid-2">
          <article class="card">
            <div class="card-header"><h3>الحالات</h3></div>
            <canvas id="reportBar" width="420" height="240"></canvas>
          </article>
          <article class="card">
            <div class="card-header"><h3>الاتجاه الشهري</h3></div>
            <canvas id="trendBar" width="420" height="240"></canvas>
          </article>
        </div>

        <div class="grid-2">
          <article class="card">
            <div class="card-header"><h3>حسب القسم</h3></div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>القسم</th><th>العدد</th><th>الموافق</th><th>المرفوض</th></tr></thead>
                <tbody id="deptBody"></tbody>
              </table>
            </div>
          </article>
          <article class="card">
            <div class="card-header"><h3>حسب نوع الطلب</h3></div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>نوع الطلب</th><th>العدد</th><th>النسبة</th></tr></thead>
                <tbody id="typeBody"></tbody>
              </table>
            </div>
          </article>
        </div>
      </section>
    </main>
  </div>
  <div id="toastContainer" class="toast-container"></div>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/firebase.js?v=20260811-delete-3"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
