<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الطلبات - شركة تكافل العراق للتامين التكافلي</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main-content">
      <header class="topbar" id="topbar"></header>
      <section class="content-wrap">
        <article class="card">
          <div class="toolbar">
            <input id="searchInput" type="text" placeholder="ابحث في العنوان أو الوصف..." />
            <select id="statusFilter">
              <option value="all">كل الحالات</option>
              <option value="Pending">قيد الانتظار</option>
              <option value="Approved">موافق عليه</option>
              <option value="Rejected">مرفوض</option>
            </select>
            <button id="exportExcelBtn" type="button" class="btn btn-success">Excel</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>رقم الطلب</th>
                  <th>نوع الطلب</th>
                  <th>اسم الموظف</th>
                  <th>مقدم الطلب</th>
                  <th>القسم</th>
                  <th>المبلغ</th>
                  <th>الحالة</th>
                  <th>الصرف</th>
                  <th>ملاحظة القرار</th>
                  <th>تاريخ الإنشاء</th>
                  <th>آخر تحديث</th>
                  <th>الإجراءات</th>
                </tr>
              </thead>
              <tbody id="requestsTableBody"></tbody>
            </table>
          </div>
        </article>
      </section>
    </main>
  </div>
  <div id="toastContainer" class="toast-container"></div>
  <script src="js/firebase-config.js"></script>
  <script src="js/firebase.js?v=20260817-online-1"></script>
  <script src="js/app.js?v=20260817-disburse-1"></script>
  <script src="js/auth.js?v=20260810-ceo-code-1"></script>
  <script src="js/requests.js?v=20260817-disburse-1"></script>
</body>
</html>
